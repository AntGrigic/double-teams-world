<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2ECEA;
    --surface: #FBF8F7;
    --ink: #2A2124;
    --muted: #8B7B7E;
    --line: #DED3D1;
    --claret: #7A2E3E;
    --sage: #4F6B57;
    --gold: #9A7B3F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #191416; --surface: #221B1E; --ink: #F0E8E9; --muted: #9C8B8F;
      --line: #372C30; --claret: #D98A9C; --sage: #93B79B; --gold: #CBA95F;
    }
  }
  :root[data-theme="dark"] {
    --paper: #191416; --surface: #221B1E; --ink: #F0E8E9; --muted: #9C8B8F;
    --line: #372C30; --claret: #D98A9C; --sage: #93B79B; --gold: #CBA95F;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: Karla, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 18px 16px 90px; }

  h1 {
    font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
    font-size: clamp(32px, 10vw, 46px); line-height: 0.95; margin: 0 0 12px; letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; color: var(--muted); }
  .stats strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter { height: 3px; background: var(--line); margin: 10px 0 18px; border-radius: 2px; overflow: hidden; }
  .meter span { display: block; height: 100%; width: 0; background: var(--sage); transition: width .3s ease; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; font: inherit; font-size: 15px; padding: 10px 6px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 10px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 15px; }
  .card h2 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 23px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  input[type="text"], input[type="search"] {
    width: 100%; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--claret); outline-offset: 2px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { margin-bottom: 12px; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 40px; height: 40px; font-size: 20px; line-height: 1;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line);
    border-radius: 50%; cursor: pointer;
  }
  .stepper output { font-size: 19px; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper .hint { font-size: 13px; color: var(--muted); }
  #companions { display: grid; gap: 8px; margin-top: 12px; }
  #companions:empty { margin: 0; }
  .primary {
    width: 100%; margin-top: 14px; font: inherit; font-weight: 600; padding: 13px;
    border: 0; border-radius: 9px; background: var(--claret); color: var(--surface); cursor: pointer;
  }
  .ghost { font: inherit; font-size: 14px; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 4px; text-decoration: underline; }

  .chips { display: flex; gap: 6px; margin: 22px 0 10px; flex-wrap: wrap; }
  .chip {
    font: inherit; font-size: 14px; padding: 8px 13px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li.guest { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li.guest.done { background: transparent; }
  .row { display: flex; align-items: center; gap: 11px; padding: 11px 13px; }
  .tick {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--line); background: transparent; color: transparent;
    font-size: 15px; line-height: 1; cursor: pointer; display: grid; place-items: center;
  }
  .done .tick { background: var(--sage); border-color: var(--sage); color: var(--surface); }
  .who { flex: 1 1 auto; min-width: 0; cursor: pointer; text-align: left; background: none; border: 0; font: inherit; color: inherit; padding: 0; }
  .who .name { display: block; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
  .done .who .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .who .sub { display: block; font-size: 13px; color: var(--muted); }
  .badge { flex: 0 0 auto; font-size: 13px; color: var(--claret); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .seatpill { flex: 0 0 auto; font-size: 12px; color: var(--gold); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .detail { padding: 0 13px 13px 54px; font-size: 14px; color: var(--muted); }
  .person { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-top: 1px solid var(--line); }
  .person:first-child { border-top: 0; }
  .person .pn { flex: 1 1 auto; color: var(--ink); font-size: 14.5px; overflow-wrap: anywhere; }
  .age {
    font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .age[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--surface); }
  .acts { display: flex; gap: 14px; margin-top: 10px; }
  .acts button { font: inherit; font-size: 14px; background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; }
  .acts .edit { color: var(--ink); }
  .acts .del { color: var(--claret); }
  .empty { border: 1px dashed var(--line); border-radius: 12px; padding: 26px 16px; text-align: center; color: var(--muted); font-size: 15px; }

  /* tables view */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .btn {
    font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn.accent { background: var(--claret); border-color: var(--claret); color: var(--surface); font-weight: 600; }
  .table { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .thead { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px 8px; }
  .thead .tname { font-family: "Instrument Serif", Georgia, serif; font-size: 22px; flex: 1 1 auto; }
  .thead .tmeta { font-size: 13px; color: var(--muted); }
  .thead .x { font: inherit; font-size: 13px; background: none; border: 0; color: var(--claret); cursor: pointer; text-decoration: underline; }
  .seats { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
  @media (min-width: 520px) { .seats { grid-template-columns: 1fr 1fr; } }
  .seat {
    display: flex; align-items: center; gap: 9px; width: 100%;
    font: inherit; text-align: left; padding: 9px 13px; cursor: pointer;
    background: var(--surface); color: var(--ink); border: 0;
  }
  .seat .no { flex: 0 0 auto; width: 22px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seat .pname { flex: 1 1 auto; font-size: 15px; overflow-wrap: anywhere; }
  .seat.free .pname { color: var(--muted); font-style: italic; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); white-space: nowrap; }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(20,12,14,.55); display: grid; place-items: end center; padding: 12px; z-index: 20; }
  .sheet {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    width: 100%; max-width: 560px; max-height: 80vh; overflow: auto; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h3 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 10px; }
  .opt {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 15px;
    padding: 11px 12px; margin-bottom: 6px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--paper); color: var(--ink); cursor: pointer;
  }
  .opt small { display: block; color: var(--muted); font-size: 12.5px; }

  /* print */
  #print { display: none; }
  @media print {
    .wrap, .scrim { display: none !important; }
    #print { display: block; font-family: Karla, Arial, sans-serif; color: #000; background: #fff; }
    @page { margin: 12mm; }
    #print h2 { font-size: 15pt; margin: 0 0 8pt; border-bottom: 1pt solid #000; padding-bottom: 3pt; }
    #print h3 { font-size: 11pt; margin: 0 0 3pt; }
    .ptable { break-inside: avoid; page-break-inside: avoid; display: inline-block; vertical-align: top; width: 48%; margin: 0 1% 10pt 0; font-size: 9.5pt; }
    .ptable ol { margin: 0; padding-left: 16pt; }
    .ptable li { margin-bottom: 1pt; }
    .pgrid { font-size: 9pt; }
    table.chk { width: 100%; border-collapse: collapse; font-size: 9pt; }
    table.chk th, table.chk td { border: 0.5pt solid #999; padding: 2.5pt 4pt; text-align: left; }
    table.chk th { background: #eee; }
    .brk { page-break-before: always; }
    .box { display: inline-block; width: 9pt; height: 9pt; border: 0.7pt solid #000; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Wedding<br><em>plan</em></h1>
  <div class="stats">
    <span><strong id="s-called">0</strong>/<strong id="s-parties">0</strong> called</span>
    <span><strong id="s-heads">0</strong> people</span>
    <span><strong id="s-kids">0</strong> kids · <strong id="s-inf">0</strong> infants</span>
    <span><strong id="s-seated">0</strong> seated</span>
  </div>
  <div class="meter"><span id="bar"></span></div>

  <div class="tabs">
    <button id="tab-guests" aria-pressed="true">Guests</button>
    <button id="tab-tables" aria-pressed="false">Tables</button>
    <button id="btn-print">Print / PDF</button>
  </div>

  <!-- GUESTS -->
  <section id="view-guests">
    <form class="card" id="form" autocomplete="off">
      <h2 id="form-title">Add a guest</h2>
      <div class="two">
        <div class="field"><label for="first">First name</label><input type="text" id="first" required></div>
        <div class="field"><label for="last">Last name</label><input type="text" id="last"></div>
      </div>
      <label>Bringing others</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="One fewer">–</button>
        <output id="count" aria-live="polite">0</output>
        <button type="button" id="plus" aria-label="One more">+</button>
        <span class="hint">Names optional</span>
      </div>
      <div id="companions"></div>
      <button class="primary" type="submit" id="submit">Add to the list</button>
      <button class="ghost" type="button" id="cancel" hidden>Cancel edit</button>
    </form>

    <div class="chips">
      <button class="chip" data-filter="todo" aria-pressed="true">To call</button>
      <button class="chip" data-filter="all" aria-pressed="false">Everyone</button>
      <button class="chip" data-filter="done" aria-pressed="false">Called</button>
      <button class="chip" data-filter="unseated" aria-pressed="false">Not seated</button>
    </div>
    <div class="field"><input type="search" id="search" placeholder="Search names"></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden></div>
  </section>

  <!-- TABLES -->
  <section id="view-tables" hidden>
    <div class="toolbar">
      <button class="btn" id="add10">Add table · 10 seats</button>
      <button class="btn" id="add12">Add table · 12 seats</button>
      <button class="btn accent" id="autoseat">Seat everyone left</button>
    </div>
    <div id="tables"></div>
    <h2 style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:23px;margin:22px 0 10px">Still standing</h2>
    <ul class="list" id="unseated"></ul>
  </section>
</div>

<div id="print"></div>

<script>
(function () {
  var KEY = 'wedding-plan-v2';
  var SEED = [
["Luka","Cosic",1,""],["Luka","Garic",1,"Lucija"],["Filip","Jovanovic",1,"Mateja"],
["Juraj","Cvetko",1,"Anamaria"],["Stjepan","Majhen",0,""],["Dinko","Simenc",1,"Tina"],
["Antonio","Salov",1,"Nada,Rebeka"],["Dino","Harambasic",1,"Helena,Iskra"],["Milos","Gavrilovic",1,"Dusica"],
["Darko","Steficar",1,""],["Adrin","Liber",1,""],["Mario","Hudolin",0,"Monika"],
["Tomislav","Zivkovic",1,"Katarina"],["Sara","Zivkovic",1,""],["Lara","Zivkovic",1,""],
["Melita","Zivkovic",1,""],["Kuma","Kata",1,""],["Ivan","Zivkovic",1,""],
["Lovro","Lesic",0,""],["Josip","Lesic",0,"Lana"],["Luka","Golubicic",1,"Patricija,Lora"],
["Laura","Babogredac",1,"Robert"],["Duka","Golubicic",1,""],["Mato","Golubicic",1,"Bilja"],
["Marijana","Dominkovic",1,"Zelja"],["Marko","Lesic",0,"Eva"],["Kata","Bikic",1,"Bikic"],
["Roberta","Pejic",1,"Tunjo,Dijete 1,Dijete 2"],["Kruno","Perikic",0,"Adriana"],["Ivica","Aleksic",1,"Anica"],
["Ivica","Jemric",1,"Anica"],["Anamarija","Aleksic",1,"Njezin decko"],["Marko","Aleksic",1,"Cura"],
["Stjepan","Aleksic",1,""],["Ivan (Boki)","Borilovic",0,""],["Dario","Baotic",1,"Marinela"],
["Anica","Dzoic",1,"Marijan"],["Jela","Grabner",1,""],["Mara","Knezevic",1,""],
["Bozica","",1,"Josip (Jole)"],["Vera","Vagner",1,"Momak"],["Branimir","Wolf",1,"Ana"],
["Duro (Doko)","Bilic",0,""],["Ilija","Sokic",1,"Jelena"],["Zeljko","Pavlovic",0,"Bilja"],
["Tino","Tomasevic",0,"Ana"],["Taso","Ostojic",0,"Mira"],["Danijela","Macner",1,""],
["Gordana","Ivkovic-Maric",1,""],["Julijana","Klacar",1,""],["Ruda","Mikulic",1,"Nada"],
["Ivica","Vinkovic",0,"Dragana"],["Luka","Vinkovic",0,"Nadja,Beba"],["Lucija","Vinkovic",0,""],
["Zdravko","Vinkovic",0,"Jadranka"],["Marija","Vinkovic",0,""],
["Adam","Vinkovic",0,"Korina,Vita,Rafael,Vincent,Rebeka"],
["Martina","Flajnek",0,"Franjo,Dijete 1,Dijete 2"],["Mirna","Mikec",1,"Ico"],
["Tomislav","Mikec",0,"Maja,Jakov,Lukas"],["Ivan","Mikec",1,"Marina,Eugen,Erika"],
["Zeljko","Matic",0,""],["Nevenka","Nedic",0,""],["Ivica","Grigic",1,"Violeta"],
["Mateo","Grigic",1,"Lea"],["Josip","Grigic",1,""],["Kata","Knezevic",1,"Mato"],
["Zorica","Spoljaric",1,"Igor"],["Irena","Stimac",0,"Dzeno"],["Emily","Spoljaric",1,"Decko"],
["Patrik","Spoljaric",1,""],["Nikola","Komes",1,"Zena"],["Karlo","Komes",1,""],
["Jurica","Wilam",1,"Zarucnica"],["Adam","Marjanovic",1,""],["Luka","Dragicevic",1,""],
["Hana","",1,""],["Petar","Babic",1,""],["Danko","Putar",1,""],["Filip","Vuckovic",1,""],
["Tomislav","Hosni",1,""],["Ana","",1,""],["Goran","Hacek",1,""]
  ];

  var guests = [], tables = [], filter = 'todo', query = '', editingId = null, open = {}, view = 'guests';
  var $ = function (id) { return document.getElementById(id); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };

  function guessAge(name) {
    if (/beba|bebica/i.test(name)) return 'infant';
    if (/dijete|dite|klinac/i.test(name)) return 'kid';
    return 'adult';
  }
  function seed() {
    guests = SEED.map(function (r) {
      var id = uid();
      var names = r[3] ? r[3].split(',') : [];
      return {
        id: id, first: r[0], last: r[1], called: !!r[2], age: 'adult',
        companions: names.map(function (n, i) {
          n = n.trim();
          return { id: id + ':' + i, name: n, age: guessAge(n) };
        })
      };
    });
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.guests)) { guests = d.guests; tables = d.tables || []; return; }
      }
    } catch (e) {}
    seed();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ guests: guests, tables: tables })); } catch (e) {} }

  // ---- people helpers -------------------------------------------------
  function fullName(g) { return (g.first + ' ' + (g.last || '')).trim(); }
  function party(g) {
    var out = [{ id: g.id, name: fullName(g), age: g.age || 'adult', main: true, guest: g }];
    (g.companions || []).forEach(function (c, i) {
      out.push({ id: c.id, name: c.name || (fullName(g) + ' +' + (i + 1)), age: c.age || 'adult', main: false, guest: g });
    });
    return out;
  }
  function allPeople() {
    var out = [];
    guests.forEach(function (g) { party(g).forEach(function (p) { out.push(p); }); });
    return out;
  }
  function personIndex() {
    var m = {};
    allPeople().forEach(function (p) { m[p.id] = p; });
    return m;
  }
  function seatOf(pid) {
    for (var t = 0; t < tables.length; t++) {
      var i = tables[t].seats.indexOf(pid);
      if (i > -1) return { table: tables[t], index: i };
    }
    return null;
  }
  function unseatPerson(pid) {
    tables.forEach(function (t) {
      var i = t.seats.indexOf(pid);
      if (i > -1) t.seats[i] = null;
    });
  }
  function freeCount(t) { return t.seats.filter(function (s) { return !s; }).length; }
  function findRun(t, n) {
    var s = t.seats, len = s.length;
    for (var start = 0; start < len; start++) {
      var ok = true, idx = [];
      for (var k = 0; k < n; k++) {
        var j = (start + k) % len;
        if (s[j]) { ok = false; break; }
        idx.push(j);
      }
      if (ok) return idx;
    }
    return null;
  }
  function freeSeats(t, n) {
    var idx = [];
    for (var i = 0; i < t.seats.length && idx.length < n; i++) if (!t.seats[i]) idx.push(i);
    return idx.length === n ? idx : null;
  }
  function seatParty(g, t) {
    var people = party(g).filter(function (p) { return !seatOf(p.id); });
    if (!people.length) return true;
    var idx = findRun(t, people.length) || freeSeats(t, people.length);
    if (!idx) return false;
    idx.forEach(function (i, k) { t.seats[i] = people[k].id; });
    return true;
  }

  // ---- add / edit form ------------------------------------------------
  var count = 0;
  function renderCompanions(values) {
    var box = $('companions');
    var existing = [].map.call(box.querySelectorAll('input'), function (i) { return i.value; });
    var vals = values || existing;
    box.innerHTML = '';
    for (var i = 0; i < count; i++) {
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Guest ' + (i + 1) + ' name';
      input.value = vals[i] || '';
      box.appendChild(input);
    }
    $('count').textContent = count;
  }
  $('plus').addEventListener('click', function () { if (count < 12) { count++; renderCompanions(); } });
  $('minus').addEventListener('click', function () { if (count > 0) { count--; renderCompanions(); } });
  function resetForm() {
    editingId = null; count = 0;
    $('first').value = ''; $('last').value = '';
    renderCompanions([]);
    $('form-title').textContent = 'Add a guest';
    $('submit').textContent = 'Add to the list';
    $('cancel').hidden = true;
  }
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var first = $('first').value.trim();
    if (!first) return;
    var names = [].map.call($('companions').querySelectorAll('input'), function (i) { return i.value.trim(); });
    if (editingId) {
      var g = guests.filter(function (x) { return x.id === editingId; })[0];
      if (g) {
        g.first = first; g.last = $('last').value.trim();
        var old = g.companions || [];
        (old.slice(names.length)).forEach(function (c) { unseatPerson(c.id); });
        g.companions = names.map(function (n, i) {
          return old[i] ? { id: old[i].id, name: n, age: old[i].age || 'adult' } : { id: g.id + ':' + i + ':' + uid(), name: n, age: guessAge(n) };
        });
      }
    } else {
      var id = uid();
      guests.push({
        id: id, first: first, last: $('last').value.trim(), called: false, age: 'adult',
        companions: names.map(function (n, i) { return { id: id + ':' + i, name: n, age: guessAge(n) }; })
      });
    }
    save(); resetForm(); render();
  });
  $('cancel').addEventListener('click', resetForm);
  function startEdit(g) {
    editingId = g.id;
    $('first').value = g.first; $('last').value = g.last || '';
    count = (g.companions || []).length;
    renderCompanions((g.companions || []).map(function (c) { return c.name; }));
    $('form-title').textContent = 'Edit guest';
    $('submit').textContent = 'Save changes';
    $('cancel').hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    $('first').focus();
  }

  // ---- tabs / filters -------------------------------------------------
  function setView(v) {
    view = v;
    $('view-guests').hidden = v !== 'guests';
    $('view-tables').hidden = v !== 'tables';
    $('tab-guests').setAttribute('aria-pressed', String(v === 'guests'));
    $('tab-tables').setAttribute('aria-pressed', String(v === 'tables'));
    render();
  }
  $('tab-guests').addEventListener('click', function () { setView('guests'); });
  $('tab-tables').addEventListener('click', function () { setView('tables'); });
  [].forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.addEventListener('click', function () {
      filter = c.dataset.filter;
      [].forEach.call(document.querySelectorAll('.chip'), function (o) { o.setAttribute('aria-pressed', String(o === c)); });
      render();
    });
  });
  $('search').addEventListener('input', function () { query = this.value.toLowerCase().trim(); render(); });

  // ---- modal ----------------------------------------------------------
  function sheet(title, build) {
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    var box = document.createElement('div');
    box.className = 'sheet';
    var h = document.createElement('h3');
    h.textContent = title;
    box.appendChild(h);
    function close() { scrim.remove(); }
    build(box, close);
    var cancel = document.createElement('button');
    cancel.className = 'ghost';
    cancel.textContent = 'Close';
    cancel.addEventListener('click', close);
    box.appendChild(cancel);
    scrim.appendChild(box);
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
    document.body.appendChild(scrim);
  }
  function option(parent, label, sub, fn) {
    var b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.textContent = label;
    if (sub) { var s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
    b.addEventListener('click', fn);
    parent.appendChild(b);
    return b;
  }

  // ---- tables view ----------------------------------------------------
  function addTable(size) {
    tables.push({ id: uid(), name: 'Table ' + (tables.length + 1), size: size, seats: new Array(size).fill(null) });
    save(); render();
  }
  $('add10').addEventListener('click', function () { addTable(10); });
  $('add12').addEventListener('click', function () { addTable(12); });
  $('autoseat').addEventListener('click', function () {
    var left = 0;
    guests.forEach(function (g) {
      var need = party(g).filter(function (p) { return !seatOf(p.id); });
      if (!need.length) return;
      var placed = false;
      for (var i = 0; i < tables.length && !placed; i++) placed = seatParty(g, tables[i]);
      if (!placed) left++;
    });
    save(); render();
    if (left) alert(left + ' parties did not fit. Add more tables and press again.');
  });

  function pickPersonForSeat(t, i) {
    sheet('Seat ' + (i + 1) + ' · ' + t.name, function (box, close) {
      var any = false;
      guests.forEach(function (g) {
        party(g).forEach(function (p) {
          if (seatOf(p.id)) return;
          any = true;
          option(box, p.name, p.main ? null : 'with ' + fullName(g), function () {
            t.seats[i] = p.id; save(); close(); render();
          });
        });
      });
      if (!any) { var e = document.createElement('p'); e.textContent = 'Everyone has a seat.'; box.appendChild(e); }
    });
  }
  function seatMenu(t, i, p) {
    sheet(p.name, function (box, close) {
      option(box, 'Take out of the seat', null, function () { t.seats[i] = null; save(); close(); render(); });
      option(box, 'Seat the whole party here', 'Puts everyone from this party at ' + t.name, function () {
        party(p.guest).forEach(function (m) { unseatPerson(m.id); });
        seatParty(p.guest, t); save(); close(); render();
      });
      tables.forEach(function (ot) {
        if (ot.id === t.id || !freeCount(ot)) return;
        option(box, 'Move to ' + ot.name, freeCount(ot) + ' seats free', function () {
          var free = freeSeats(ot, 1);
          t.seats[i] = null; ot.seats[free[0]] = p.id; save(); close(); render();
        });
      });
    });
  }
  function seatPartyMenu(g) {
    sheet('Seat ' + fullName(g), function (box, close) {
      var n = party(g).filter(function (p) { return !seatOf(p.id); }).length;
      var any = false;
      tables.forEach(function (t) {
        if (freeCount(t) < n) return;
        any = true;
        option(box, t.name, freeCount(t) + ' of ' + t.size + ' seats free', function () {
          seatParty(g, t); save(); close(); render();
        });
      });
      if (!any) { var e = document.createElement('p'); e.textContent = 'No table has ' + n + ' free seats. Add another table.'; box.appendChild(e); }
    });
  }

  function renderTables() {
    var idx = personIndex();
    var wrapEl = $('tables');
    wrapEl.innerHTML = '';
    if (!tables.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No tables yet. Add one above, then seat people.';
      wrapEl.appendChild(e);
    }
    tables.forEach(function (t, ti) {
      var box = document.createElement('div');
      box.className = 'table';
      var head = document.createElement('div');
      head.className = 'thead';
      var nm = document.createElement('div');
      nm.className = 'tname';
      nm.textContent = t.name;
      nm.addEventListener('click', function () {
        var v = prompt('Table name', t.name);
        if (v !== null && v.trim()) { t.name = v.trim(); save(); render(); }
      });
      var meta = document.createElement('span');
      meta.className = 'tmeta';
      meta.textContent = (t.size - freeCount(t)) + '/' + t.size;
      var x = document.createElement('button');
      x.className = 'x'; x.type = 'button'; x.textContent = 'Delete';
      x.addEventListener('click', function () {
        if (!confirm('Delete ' + t.name + '? Everyone at it goes back to the unseated list.')) return;
        tables.splice(ti, 1); save(); render();
      });
      head.appendChild(nm); head.appendChild(meta); head.appendChild(x);
      box.appendChild(head);

      var grid = document.createElement('div');
      grid.className = 'seats';
      t.seats.forEach(function (pid, i) {
        var p = pid ? idx[pid] : null;
        if (pid && !p) { t.seats[i] = null; pid = null; }
        var b = document.createElement('button');
        b.className = 'seat' + (p ? '' : ' free');
        b.type = 'button';
        var no = document.createElement('span'); no.className = 'no'; no.textContent = (i + 1);
        var nmn = document.createElement('span'); nmn.className = 'pname'; nmn.textContent = p ? p.name : 'empty';
        b.appendChild(no); b.appendChild(nmn);
        if (p && p.age !== 'adult') {
          var tg = document.createElement('span'); tg.className = 'tag';
          tg.textContent = p.age === 'infant' ? 'infant' : 'kid';
          b.appendChild(tg);
        }
        b.addEventListener('click', function () { p ? seatMenu(t, i, p) : pickPersonForSeat(t, i); });
        grid.appendChild(b);
      });
      box.appendChild(grid);
      wrapEl.appendChild(box);
    });

    var ul = $('unseated');
    ul.innerHTML = '';
    var none = true;
    guests.forEach(function (g) {
      var left = party(g).filter(function (p) { return !seatOf(p.id); });
      if (!left.length) return;
      none = false;
      var li = document.createElement('li');
      li.className = 'guest';
      var row = document.createElement('div');
      row.className = 'row';
      var who = document.createElement('span');
      who.className = 'who';
      who.innerHTML = '<span class="name"></span>';
      who.querySelector('.name').textContent = fullName(g);
      var sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = left.length + (left.length === 1 ? ' person' : ' people') + ' to seat';
      who.appendChild(sub);
      var b = document.createElement('button');
      b.className = 'btn';
      b.type = 'button';
      b.textContent = 'Seat';
      b.addEventListener('click', function () { seatPartyMenu(g); });
      row.appendChild(who); row.appendChild(b);
      li.appendChild(row);
      ul.appendChild(li);
    });
    if (none) {
      var li2 = document.createElement('li');
      li2.className = 'empty';
      li2.textContent = tables.length ? 'Everybody has a seat.' : 'Add a table to start seating.';
      ul.appendChild(li2);
    }
  }

  // ---- guests view ----------------------------------------------------
  function ageRow(parent, p, onChange) {
    var r = document.createElement('div');
    r.className = 'person';
    var n = document.createElement('span');
    n.className = 'pn';
    n.textContent = p.name;
    r.appendChild(n);
    var s = seatOf(p.id);
    if (s) {
      var sp = document.createElement('span');
      sp.className = 'seatpill';
      sp.textContent = s.table.name + ' · ' + (s.index + 1);
      r.appendChild(sp);
    }
    [['infant', 'infant 1–3'], ['kid', 'kid 3–12']].forEach(function (a) {
      var b = document.createElement('button');
      b.className = 'age';
      b.type = 'button';
      b.textContent = a[1];
      b.setAttribute('aria-pressed', String(p.age === a[0]));
      b.addEventListener('click', function () { onChange(p.age === a[0] ? 'adult' : a[0]); });
      r.appendChild(b);
    });
    parent.appendChild(r);
  }

  function renderGuests() {
    var shown = guests.filter(function (g) {
      if (filter === 'todo' && g.called) return false;
      if (filter === 'done' && !g.called) return false;
      if (filter === 'unseated' && !party(g).some(function (p) { return !seatOf(p.id); })) return false;
      if (query) {
        var hay = (fullName(g) + ' ' + (g.companions || []).map(function (c) { return c.name; }).join(' ')).toLowerCase();
        if (hay.indexOf(query) === -1) return false;
      }
      return true;
    });

    var list = $('list');
    list.innerHTML = '';
    shown.forEach(function (g) {
      var li = document.createElement('li');
      li.className = 'guest' + (g.called ? ' done' : '');
      var row = document.createElement('div');
      row.className = 'row';

      var tick = document.createElement('button');
      tick.className = 'tick'; tick.type = 'button'; tick.textContent = '✓';
      tick.setAttribute('aria-label', (g.called ? 'Mark as not called: ' : 'Mark as called: ') + fullName(g));
      tick.addEventListener('click', function () { g.called = !g.called; save(); render(); });

      var who = document.createElement('button');
      who.className = 'who'; who.type = 'button';
      who.innerHTML = '<span class="name"></span>';
      who.querySelector('.name').textContent = fullName(g);
      var listed = (g.companions || []).map(function (c) { return c.name; }).filter(Boolean);
      if (listed.length) {
        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = 'with ' + listed.join(', ');
        who.appendChild(sub);
      }
      who.addEventListener('click', function () { open[g.id] = !open[g.id]; render(); });

      row.appendChild(tick); row.appendChild(who);
      var seat0 = seatOf(g.id);
      if (seat0) {
        var sp = document.createElement('span');
        sp.className = 'seatpill';
        sp.textContent = seat0.table.name;
        row.appendChild(sp);
      }
      if ((g.companions || []).length) {
        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '+' + g.companions.length;
        row.appendChild(badge);
      }
      li.appendChild(row);

      if (open[g.id]) {
        var d = document.createElement('div');
        d.className = 'detail';
        ageRow(d, party(g)[0], function (v) { g.age = v; save(); render(); });
        (g.companions || []).forEach(function (c, i) {
          ageRow(d, { id: c.id, name: c.name || ('Guest ' + (i + 1)), age: c.age || 'adult' }, function (v) { c.age = v; save(); render(); });
        });
        var acts = document.createElement('div');
        acts.className = 'acts';
        var ed = document.createElement('button');
        ed.className = 'edit'; ed.type = 'button'; ed.textContent = 'Edit names';
        ed.addEventListener('click', function () { startEdit(g); });
        var st = document.createElement('button');
        st.className = 'edit'; st.type = 'button'; st.textContent = 'Seat party';
        st.addEventListener('click', function () { seatPartyMenu(g); });
        var del = document.createElement('button');
        del.className = 'del'; del.type = 'button'; del.textContent = 'Remove';
        del.addEventListener('click', function () {
          if (!confirm('Remove ' + fullName(g) + ' and their party?')) return;
          party(g).forEach(function (p) { unseatPerson(p.id); });
          guests = guests.filter(function (x) { return x.id !== g.id; });
          if (editingId === g.id) resetForm();
          save(); render();
        });
        acts.appendChild(ed); acts.appendChild(st); acts.appendChild(del);
        d.appendChild(acts);
        li.appendChild(d);
      }
      list.appendChild(li);
    });

    var empty = $('empty');
    if (shown.length) empty.hidden = true;
    else {
      empty.hidden = false;
      if (!guests.length) empty.textContent = 'Nobody on the list.';
      else if (query) empty.textContent = 'No names match "' + $('search').value.trim() + '".';
      else if (filter === 'todo') empty.textContent = 'Everyone has been called.';
      else if (filter === 'unseated') empty.textContent = 'Everyone has a seat.';
      else empty.textContent = 'No calls made yet.';
    }
  }

  // ---- stats + render -------------------------------------------------
  function render() {
    var people = allPeople();
    var called = guests.filter(function (g) { return g.called; }).length;
    var seated = people.filter(function (p) { return seatOf(p.id); }).length;
    $('s-called').textContent = called;
    $('s-parties').textContent = guests.length;
    $('s-heads').textContent = people.length;
    $('s-kids').textContent = people.filter(function (p) { return p.age === 'kid'; }).length;
    $('s-inf').textContent = people.filter(function (p) { return p.age === 'infant'; }).length;
    $('s-seated').textContent = seated;
    $('bar').style.width = guests.length ? (called / guests.length * 100) + '%' : '0';
    if (view === 'guests') renderGuests(); else renderTables();
  }

  // ---- print ----------------------------------------------------------
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  $('btn-print').addEventListener('click', function () {
    var idx = personIndex();
    var h = '<h2>Seating plan</h2>';
    if (!tables.length) h += '<p>No tables set up yet.</p>';
    tables.forEach(function (t) {
      h += '<div class="ptable"><h3>' + esc(t.name) + '</h3><ol>';
      t.seats.forEach(function (pid) {
        var p = pid ? idx[pid] : null;
        var tag = p && p.age !== 'adult' ? ' (' + (p.age === 'infant' ? 'infant' : 'kid') + ')' : '';
        h += '<li>' + (p ? esc(p.name) + tag : '—') + '</li>';
      });
      h += '</ol></div>';
    });

    var rows = allPeople().map(function (p) {
      var s = seatOf(p.id);
      return {
        name: p.name,
        party: p.main ? '' : fullName(p.guest),
        table: s ? s.table.name : '',
        seat: s ? (s.index + 1) : '',
        age: p.age === 'adult' ? '' : (p.age === 'infant' ? 'infant' : 'kid')
      };
    }).sort(function (a, b) { return a.name.localeCompare(b.name, 'hr'); });

    h += '<div class="brk"></div><h2>Guest checklist · ' + rows.length + ' people</h2>';
    h += '<table class="chk"><thead><tr><th></th><th>Name</th><th>With</th><th>Table</th><th>Seat</th><th>Age</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr><td><span class="box"></span></td><td>' + esc(r.name) + '</td><td>' + esc(r.party) +
           '</td><td>' + esc(r.table) + '</td><td>' + esc(r.seat) + '</td><td>' + esc(r.age) + '</td></tr>';
    });
    h += '</tbody></table>';
    $('print').innerHTML = h;
    window.print();
  });

  load();
  renderCompanions([]);
  render();
})();
</script>
</body>
</html>
